<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>ICODE Universal Converter</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2234%22%20r%3D%2223%22%20fill%3D%22none%22%20stroke%3D%22%23c9d2cf%22%20stroke-width%3D%229%22%2F%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%2234%22%20r%3D%2223%22%20fill%3D%22none%22%20stroke%3D%22%231d5b38%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M58%204C34%208%2016%2024%2012%2056c26-6%2042-24%2046-52z%22%20fill%3D%22%23c9d2cf%22%2F%3E%3Cpath%20d%3D%22M58%204C36%2012%2022%2028%2014%2050%22%20fill%3D%22none%22%20stroke%3D%22%23ef7c1a%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M58%204C30%2020%2018%2038%2012%2056%22%20fill%3D%22none%22%20stroke%3D%22%231d5b38%22%20stroke-width%3D%227%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* ============================================================
   ICODE DECODER - tema clay pastel
   ============================================================ */

:root{
--ink:#3b3268;
--ink-soft:#7b74a8;
--surface:#ffffff;
--surface-2:#f5f2ff;
--line:#ece7ff;
--violet:#8b7cf6;
--sky:#5eb8f7;
--mint:#4fd1a5;
--pink:#f79ac9;
--ok:#12916a;
--err:#e0447a;
--info:#6d4aff;

--clay:
0 22px 40px rgba(96,74,180,.18),
0 8px 14px rgba(96,74,180,.10),
inset 0 8px 14px rgba(255,255,255,.95),
inset 0 -10px 18px rgba(140,120,220,.10);

--clay-sm:
0 12px 22px rgba(96,74,180,.14),
inset 0 6px 10px rgba(255,255,255,.9),
inset 0 -8px 14px rgba(140,120,220,.08);

--sunken:
inset 0 6px 12px rgba(120,100,200,.16),
inset 0 -4px 8px rgba(255,255,255,.9);
}

*{
box-sizing:border-box;
}

body{
font-family:"Nunito",system-ui,sans-serif;
background:linear-gradient(135deg,#c9b8fd 0%,#a9dcfb 45%,#aef0cf 100%);
background-size:300% 300%;
color:var(--ink);
padding:34px 26px 60px;
margin:0;
min-height:100vh;
}

/* gumpalan cahaya di latar */

body::before,body::after{
content:"";
position:fixed;
border-radius:50%;
filter:blur(70px);
opacity:.55;
z-index:-1;
pointer-events:none;
}

body::before{
width:420px;
height:420px;
top:-120px;
left:-100px;
background:radial-gradient(circle,#ffffff,#c9b8fd);
}

body::after{
width:520px;
height:520px;
right:-160px;
bottom:-180px;
background:radial-gradient(circle,#ffffff,#8ee7c4);
}

h2{
text-align:center;
font-size:30px;
font-weight:800;
letter-spacing:.5px;
margin:6px 0 4px;
background:linear-gradient(100deg,#6d4aff,#3aa0ea,#20c997,#6d4aff);
background-size:220% auto;
-webkit-background-clip:text;
background-clip:text;
color:transparent;
filter:drop-shadow(0 8px 16px rgba(109,74,255,.25));
}

/* ---------------- tab ---------------- */

.tabs{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
margin:22px 0 6px;
}

button{
font-family:"Nunito",sans-serif;
font-size:15px;
font-weight:800;
letter-spacing:.3px;
color:#fff;
border:none;
cursor:pointer;
padding:14px 26px;
border-radius:22px;
background:linear-gradient(135deg,var(--violet),var(--sky));
box-shadow:
0 14px 24px rgba(109,74,255,.32),
inset 0 6px 10px rgba(255,255,255,.45),
inset 0 -8px 12px rgba(70,40,160,.22);
}

button:hover{
transform:translateY(-3px);
box-shadow:
0 20px 30px rgba(109,74,255,.36),
inset 0 6px 10px rgba(255,255,255,.5),
inset 0 -8px 12px rgba(70,40,160,.22);
}

button:active{
transform:translateY(2px) scale(.98);
box-shadow:
0 6px 12px rgba(109,74,255,.28),
inset 0 8px 14px rgba(70,40,160,.25);
}

button.small{
padding:12px 20px;
font-size:14px;
border-radius:18px;
}

button.tab{
background:rgba(255,255,255,.75);
color:var(--ink-soft);
box-shadow:var(--clay-sm);
}

button.tab:hover{
color:var(--ink);
}

button.tab.active{
background:linear-gradient(135deg,var(--violet),var(--sky));
color:#fff;
box-shadow:
0 16px 26px rgba(109,74,255,.34),
inset 0 6px 10px rgba(255,255,255,.45),
inset 0 -8px 12px rgba(70,40,160,.22);
}

/* ---------------- panel ---------------- */

#tab-decode,#tab-wmble,#tab-conv,#tab-time{
background:rgba(255,255,255,.72);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border-radius:34px;
padding:28px;
margin-top:18px;
box-shadow:var(--clay);
}

/* ---------------- isian ---------------- */

textarea,.field input,select{
font-family:"JetBrains Mono",monospace;
font-size:15px;
width:100%;
color:var(--ink);
background:var(--surface-2);
border:2px solid transparent;
border-radius:20px;
padding:16px 18px;
outline:none;
box-shadow:var(--sunken);
}

textarea{
height:150px;
resize:vertical;
}

textarea::placeholder,.field input::placeholder{
color:#a9a3cc;
}

textarea:focus,.field input:focus,select:focus{
border-color:var(--violet);
box-shadow:var(--sunken),0 0 0 6px rgba(139,124,246,.16);
}

textarea.drag{
border-color:var(--mint);
background:#eefdf6;
}

select{
appearance:none;
-webkit-appearance:none;
background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;
background-size:6px 6px,6px 6px;
background-repeat:no-repeat;
padding-right:44px;
cursor:pointer;
}

.field{
display:flex;
flex-direction:column;
}

.field label,.outlabel{
color:var(--ink-soft);
font-size:12px;
font-weight:800;
letter-spacing:1.2px;
text-transform:uppercase;
margin-bottom:8px;
}

.outlabel{
margin-top:26px;
}

.convbar{
display:flex;
flex-wrap:wrap;
gap:14px;
align-items:flex-end;
}

.convbar .field{
flex:1 1 200px;
}

.convbtns{
display:flex;
flex-wrap:wrap;
gap:12px;
align-items:center;
margin-top:16px;
}

.chk{
color:var(--ink-soft);
font-size:13px;
font-weight:600;
cursor:pointer;
margin-left:6px;
}

/* ---------------- tabel ---------------- */

table{
border-collapse:separate;
border-spacing:0;
width:100%;
table-layout:fixed;
margin-top:24px;
background:var(--surface);
border-radius:26px;
overflow:hidden;
box-shadow:var(--clay-sm);
}

th{
background:linear-gradient(135deg,#ded6ff,#cfeaff);
color:var(--ink);
font-weight:800;
font-size:13px;
letter-spacing:1px;
text-transform:uppercase;
padding:14px 16px;
text-align:left;
}

td{
font-family:"JetBrains Mono",monospace;
font-size:14px;
padding:11px 16px;
border-bottom:1px solid var(--line);
vertical-align:top;
overflow-wrap:break-word;
word-break:normal;
}

th:nth-child(1),td:nth-child(1){
width:160px;
}

th:nth-child(2),td:nth-child(2){
word-break:break-all;
}

th:nth-child(3),td:nth-child(3){
width:220px;
}

tr:last-child td{
border-bottom:none;
}

#result tr:hover,#wmResult tr:hover{
background:#faf8ff;
}

.ok{color:var(--ok);font-weight:700;}
.err{color:var(--err);font-weight:700;}
.info{color:var(--info);font-weight:700;}

/* ---------------- kartu ---------------- */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:14px;
margin-top:16px;
}

.card{
background:var(--surface);
border-radius:22px;
padding:14px 16px;
box-shadow:var(--clay-sm);
}

.card span{
display:block;
color:var(--ink-soft);
font-size:11px;
font-weight:800;
letter-spacing:1px;
text-transform:uppercase;
margin-bottom:6px;
}

.card b{
font-family:"JetBrains Mono",monospace;
color:var(--ink);
font-size:16px;
font-weight:600;
word-break:break-all;
}

.card.wide{
grid-column:1/-1;
}

.card:hover{
transform:translateY(-6px);
box-shadow:
0 26px 38px rgba(96,74,180,.22),
inset 0 6px 10px rgba(255,255,255,.9),
inset 0 -8px 14px rgba(140,120,220,.10);
}

/* ---------------- kotak hasil ---------------- */

.hexout{
font-family:"JetBrains Mono",monospace;
font-size:28px;
font-weight:600;
color:#5b3fe0;
background:linear-gradient(150deg,#ffffff,#f2eeff);
border-radius:26px;
padding:22px 24px;
min-height:34px;
word-break:break-all;
box-shadow:var(--clay-sm);
}

.hexout.flash{
box-shadow:var(--clay-sm),0 0 0 6px rgba(79,209,165,.28);
}

/* ---------------- detail ---------------- */

details{
margin-top:24px;
background:rgba(255,255,255,.7);
border-radius:24px;
padding:16px 20px;
box-shadow:var(--clay-sm);
}

summary{
color:var(--info);
font-weight:800;
font-size:14px;
cursor:pointer;
outline:none;
list-style:none;
}

summary::-webkit-details-marker{
display:none;
}

summary::before{
content:"\25B8  ";
display:inline-block;
transition:transform .2s ease;
}

details[open] summary::before{
content:"\25BE  ";
}

/* titik jam */

.dot{
display:inline-block;
width:9px;
height:9px;
border-radius:50%;
background:var(--mint);
margin-left:8px;
box-shadow:0 0 0 5px rgba(79,209,165,.22);
}

footer{
margin-top:34px;
text-align:center;
color:#5d5590;
font-size:13px;
font-weight:600;
}

/* ============================================================
   ANIMASI
   ============================================================ */

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:none;}
}

@keyframes panelIn{
from{opacity:0;transform:translateY(18px) scale(.99);}
to{opacity:1;transform:none;}
}

@keyframes popIn{
from{opacity:0;transform:translateY(12px) scale(.95);}
to{opacity:1;transform:none;}
}

@keyframes dropIn{
from{opacity:0;transform:translateY(-16px);}
to{opacity:1;transform:none;}
}

@keyframes shimmer{
to{background-position:220% center;}
}

@keyframes bgShift{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

@keyframes floatBlob{
0%,100%{transform:translate(0,0) scale(1);}
50%{transform:translate(26px,-22px) scale(1.06);}
}

@keyframes breathe{
0%,100%{box-shadow:var(--sunken),0 0 0 0 rgba(79,209,165,.35);}
50%{box-shadow:var(--sunken),0 0 0 12px rgba(79,209,165,0);}
}

@keyframes blink{
0%,100%{box-shadow:0 0 0 5px rgba(79,209,165,.22);}
50%{box-shadow:0 0 0 11px rgba(79,209,165,0);}
}

body{
animation:bgShift 28s ease-in-out infinite;
}

body::before{
animation:floatBlob 16s ease-in-out infinite;
}

body::after{
animation:floatBlob 21s ease-in-out infinite reverse;
}

h2{
animation:dropIn .5s ease both,shimmer 8s linear infinite;
}

.tabs{
animation:dropIn .5s .05s ease both;
}

#tab-decode,#tab-wmble,#tab-conv,#tab-time{
animation:panelIn .4s ease both;
}

button{
transition:transform .18s ease,box-shadow .25s ease,color .2s ease,background .3s ease;
}

textarea,.field input,select{
transition:box-shadow .25s ease,border-color .25s ease,background .25s ease;
}

textarea.drag{
animation:breathe 1.4s ease infinite;
}

.card{
animation:popIn .4s ease both;
transition:transform .22s ease,box-shadow .25s ease;
}

.cards .card:nth-child(1){animation-delay:0.000s;}
.cards .card:nth-child(2){animation-delay:0.050s;}
.cards .card:nth-child(3){animation-delay:0.100s;}
.cards .card:nth-child(4){animation-delay:0.150s;}
.cards .card:nth-child(5){animation-delay:0.200s;}
.cards .card:nth-child(6){animation-delay:0.250s;}
.cards .card:nth-child(7){animation-delay:0.300s;}
.cards .card:nth-child(8){animation-delay:0.350s;}
.cards .card:nth-child(9){animation-delay:0.400s;}
.cards .card:nth-child(10){animation-delay:0.450s;}
.cards .card:nth-child(11){animation-delay:0.500s;}
.cards .card:nth-child(12){animation-delay:0.550s;}

#result tr,#wmResult tr{
animation:fadeIn .4s ease both;
}

#result tr:nth-child(1){animation-delay:0.000s;}
#result tr:nth-child(2){animation-delay:0.030s;}
#result tr:nth-child(3){animation-delay:0.060s;}
#result tr:nth-child(4){animation-delay:0.090s;}
#result tr:nth-child(5){animation-delay:0.120s;}
#result tr:nth-child(6){animation-delay:0.150s;}
#result tr:nth-child(7){animation-delay:0.180s;}
#result tr:nth-child(8){animation-delay:0.210s;}
#result tr:nth-child(9){animation-delay:0.240s;}
#result tr:nth-child(10){animation-delay:0.270s;}
#result tr:nth-child(11){animation-delay:0.300s;}
#result tr:nth-child(12){animation-delay:0.330s;}
#result tr:nth-child(13){animation-delay:0.360s;}
#result tr:nth-child(14){animation-delay:0.390s;}
#result tr:nth-child(15){animation-delay:0.420s;}
#result tr:nth-child(16){animation-delay:0.450s;}
#result tr:nth-child(17){animation-delay:0.480s;}
#result tr:nth-child(18){animation-delay:0.510s;}
#result tr:nth-child(19){animation-delay:0.540s;}
#result tr:nth-child(20){animation-delay:0.570s;}
#result tr:nth-child(21){animation-delay:0.600s;}
#result tr:nth-child(22){animation-delay:0.630s;}
#result tr:nth-child(23){animation-delay:0.660s;}
#result tr:nth-child(24){animation-delay:0.690s;}
#result tr:nth-child(25){animation-delay:0.720s;}
#result tr:nth-child(26){animation-delay:0.750s;}
#result tr:nth-child(27){animation-delay:0.780s;}
#result tr:nth-child(28){animation-delay:0.810s;}
#result tr:nth-child(29){animation-delay:0.840s;}
#result tr:nth-child(30){animation-delay:0.870s;}
#result tr:nth-child(31){animation-delay:0.900s;}
#result tr:nth-child(32){animation-delay:0.930s;}
#result tr:nth-child(33){animation-delay:0.960s;}
#result tr:nth-child(34){animation-delay:0.990s;}
#result tr:nth-child(35){animation-delay:1.020s;}
#result tr:nth-child(36){animation-delay:1.050s;}
#result tr:nth-child(37){animation-delay:1.080s;}
#result tr:nth-child(38){animation-delay:1.110s;}
#result tr:nth-child(39){animation-delay:1.140s;}
#result tr:nth-child(40){animation-delay:1.170s;}

tr,td{
transition:background .2s ease;
}

.hexout{
transition:box-shadow .3s ease;
}

.dot{
animation:blink 1.4s ease-out infinite;
}

/* kartu jam dibangun ulang tiap detik, jangan dianimasikan */

#tNowCards .card{
animation:none;
}

details[open] .cards{
animation:panelIn .3s ease both;
}

/* animasi sengaja tetap dijalankan walaupun Windows menyetel
   "Animation effects" ke Off (prefers-reduced-motion: reduce) */


/* ============================================================
   HIASAN 3D DI LATAR - semuanya bergerak
   ============================================================ */

.scene{
position:fixed;
inset:0;
z-index:-1;
overflow:hidden;
pointer-events:none;
}

body::before,body::after{
z-index:-2;
}

.deco{
position:absolute;
filter:drop-shadow(0 20px 26px rgba(86,66,160,.28));
will-change:transform;
}

/* pulau : naik turun sambil bergoyang */

.deco-island{
left:-34px;
bottom:-24px;
width:300px;
animation:bobRot 10s ease-in-out infinite;
}

@keyframes bobRot{
0%,100%{transform:translateY(0) rotate(-2deg);}
50%{transform:translateY(-26px) rotate(2deg);}
}

/* balon : terbang menyeberang layar sambil naik */

.deco-balloon{
left:3%;
bottom:10%;
width:112px;
animation:balloonFly 46s linear infinite;
}

@keyframes balloonFly{
0%{transform:translate(-18vw,14vh) rotate(-6deg);}
20%{transform:translate(6vw,2vh) rotate(5deg);}
40%{transform:translate(30vw,-18vh) rotate(-5deg);}
60%{transform:translate(54vw,-36vh) rotate(6deg);}
80%{transform:translate(78vw,-56vh) rotate(-4deg);}
100%{transform:translate(104vw,-88vh) rotate(4deg);}
}

/* awan : menyeberang terus menerus, arah berlawanan */

.deco-cloud1{
top:7%;
left:5%;
width:200px;
opacity:.85;
animation:crossRight 58s linear infinite;
}

.deco-cloud2{
bottom:18%;
right:6%;
width:240px;
opacity:.7;
animation:crossLeft 76s linear infinite;
}

@keyframes crossRight{
from{transform:translateX(-32vw);}
to{transform:translateX(100vw);}
}

@keyframes crossLeft{
from{transform:translateX(34vw);}
to{transform:translateX(-108vw);}
}

/* bola : mengorbit pelan */

.deco-ball1{
right:16%;
bottom:10%;
width:74px;
animation:orbit 17s ease-in-out infinite;
}

.deco-ball2{
left:9%;
top:50%;
width:52px;
animation:orbit 23s ease-in-out infinite reverse;
}

.deco-ball3{
right:6%;
top:42%;
width:40px;
animation:orbitWide 13s ease-in-out infinite;
}

@keyframes orbit{
0%,100%{transform:translate(0,0);}
25%{transform:translate(38px,-30px);}
50%{transform:translate(0,-62px);}
75%{transform:translate(-38px,-30px);}
}

@keyframes orbitWide{
0%,100%{transform:translate(0,0) rotate(0deg);}
25%{transform:translate(-52px,-26px) rotate(90deg);}
50%{transform:translate(-70px,-70px) rotate(180deg);}
75%{transform:translate(-18px,-46px) rotate(270deg);}
}

/* pesawat kertas : melintas miring lalu berulang */

.deco-plane{
left:2%;
bottom:26%;
width:78px;
opacity:.9;
animation:planeFly 26s linear infinite;
}

@keyframes planeFly{
0%{transform:translate(-20vw,22vh) rotate(-14deg);}
45%{transform:translate(42vw,-14vh) rotate(-4deg);}
55%{transform:translate(52vw,-16vh) rotate(6deg);}
100%{transform:translate(114vw,-44vh) rotate(-10deg);}
}

/* pulau kecil : mengambang lebih cepat */

.deco-island2{
right:4%;
top:16%;
width:170px;
animation:bobRot 8s ease-in-out infinite reverse;
}

/* rumpun hutan di tepi bawah */

.deco-forest{
right:6%;
bottom:-14px;
width:290px;
opacity:.95;
animation:bobRot 14s ease-in-out infinite;
}

/* pohon bergoyang tertiup angin */

.tree{
transform-origin:50% 100%;
animation:sway 4.5s ease-in-out infinite;
}

.deco g:nth-of-type(1) .tree{
animation-duration:4.2s;
animation-delay:-0.3s;
}

.deco g:nth-of-type(2) .tree{
animation-duration:5.6s;
animation-delay:-1.4s;
}

.deco g:nth-of-type(3) .tree{
animation-duration:3.8s;
animation-delay:-0.9s;
}

.deco g:nth-of-type(4) .tree{
animation-duration:6.1s;
animation-delay:-2.2s;
}

.deco g:nth-of-type(5) .tree{
animation-duration:4.9s;
animation-delay:-0.6s;
}

.deco g:nth-of-type(6) .tree{
animation-duration:5.2s;
animation-delay:-1.8s;
}

.deco g:nth-of-type(7) .tree{
animation-duration:3.5s;
animation-delay:-1.1s;
}

.deco g:nth-of-type(8) .tree{
animation-duration:6.4s;
animation-delay:-2.6s;
}

@keyframes sway{
0%,100%{transform:rotate(-2.2deg);}
50%{transform:rotate(2.2deg);}
}

/* air terjun mengalir */

.wfs{
animation:wfFall 1.5s linear infinite;
}

.wfs:nth-of-type(2){animation-duration:1.9s;animation-delay:-.4s;}
.wfs:nth-of-type(3){animation-duration:1.3s;animation-delay:-.8s;}
.wfs:nth-of-type(4){animation-duration:2.1s;animation-delay:-1.1s;}
.wfs:nth-of-type(5){animation-duration:1.7s;animation-delay:-.6s;}

@keyframes wfFall{
0%{transform:translateY(-30px);opacity:0;}
15%{opacity:.9;}
85%{opacity:.75;}
100%{transform:translateY(210px);opacity:0;}
}

/* buih di dasar air terjun */

.wfMist{
animation:mist 2.6s ease-in-out infinite;
}

.wfMist2{
animation:mist 3.4s ease-in-out infinite reverse;
}

@keyframes mist{
0%,100%{opacity:.28;transform:scale(.9);}
50%{opacity:.6;transform:scale(1.12);}

<script>

let dateOverflow=false;

/* BASIC */

function hexToInt(hex){
return parseInt(hex,16);
}

function hexToSigned32(hex){

let v=parseInt(hex,16);

if(v>0x7FFFFFFF)
v-=0x100000000;

return v;
}

function hexToSigned16(hex){

let v=parseInt(hex,16);

if(v>0x7FFF)
v-=0x10000;

return v;
}

/* CRC16 MODBUS */

function calcCRC16(bytes){

let crc=0xFFFF;

for(let b of bytes){

crc^=parseInt(b,16);

for(let i=0;i<8;i++){

if(crc&1)
crc=(crc>>1)^0xA001;
else
crc>>=1;

}

}

let hex=crc.toString(16).padStart(4,'0');

let low=hex.slice(2,4);
let high=hex.slice(0,2);

return (low+high).toLowerCase();

}

/* BCD */

function bcdDecode(bytes){

let out="";

for(let b of bytes){

let v=parseInt(b,16);

let high=(v>>4)&0xF;
let low=v&0xF;

out+=high.toString();
out+=low.toString();

}

return out;

}

/* ASCII */

function asciiDecode(bytes){

let out="";

for(let b of bytes){

let v=parseInt(b,16);

out+=(v>=32&&v<=126)?String.fromCharCode(v):".";

}

return out;

}

/* TIME */

function formatTimeUTC7(hex){

let ss=parseInt(hex.slice(0,2),16);
let mm=parseInt(hex.slice(2,4),16);
let hh=parseInt(hex.slice(4,6),16);

hh+=7;

if(hh>=24){
hh-=24;
dateOverflow=true;
}else
dateOverflow=false;

return `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;

}

function formatDateWithOverflow(hex){

let dd=parseInt(hex.slice(0,2),16);
let mm=parseInt(hex.slice(2,4),16);
let yy=parseInt(hex.slice(4,6),16);

if(dateOverflow)dd++;

return `${dd.toString().padStart(2,'0')}/${mm.toString().padStart(2,'0')}/20${yy}`;

}

/* Execution time = Hour / Minute / Second, decimal value per byte */

function formatExecTime(hex){

let hh=parseInt(hex.slice(0,2),16);
let mm=parseInt(hex.slice(2,4),16);
let ss=parseInt(hex.slice(4,6),16);

return `${hh.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}:${ss.toString().padStart(2,'0')}`;

}

/* Execution function : 0500 On / 0501 Off / 04XX dimming */

function formatExecFunction(hex){

let h=hex.toLowerCase();

if(h==="0500")return "Light On";
if(h==="0501")return "Light Off";

if(h.slice(0,2)==="04")
return "Dimming "+parseInt(h.slice(2,4),16)+" %";

return "Unknown";

}

function crcTail(bytes){

function wmLeNumber(bytes,signed=false){

let value=0;

for(let i=0;i<bytes.length;i++)
value+=parseInt(bytes[i],16)*Math.pow(256,i);

if(signed&&bytes.length>0){
let limit=Math.pow(2,bytes.length*8);
if(value>=limit/2)value-=limit;
}

return value;

}

function wmScaled(value,decimals){

let negative=value<0;
let digits=Math.abs(value).toString().padStart(decimals+1,"0");

if(decimals>0)
digits=digits.slice(0,-decimals)+"."+digits.slice(-decimals);

return (negative?"-":"")+digits;

}

function wmUnit(code){

const units={
"26":{unit:"m³",decimals:8},
"27":{unit:"m³",decimals:7},
"28":{unit:"m³",decimals:6},
"29":{unit:"m³",decimals:5},
"2a":{unit:"m³",decimals:4},
"2b":{unit:"m³",decimals:3},
"2c":{unit:"m³",decimals:2},
"34":{unit:"L/h",decimals:2},
"35":{unit:"m³/h",decimals:2},
"36":{unit:"m³/h",decimals:1},
"37":{unit:"m³/h",decimals:0},
"44":{unit:"L/h",decimals:2,negative:true},
"45":{unit:"m³/h",decimals:2,negative:true},
"46":{unit:"m³/h",decimals:1,negative:true},
"47":{unit:"m³/h",decimals:0,negative:true}
};

return units[code.toLowerCase()]||null;

}

function wmMeasurement(name,bytes){

if(bytes.length<2){
wmRow(name,bytes.join(""),"Data tidak lengkap","err");
return;
}

let code=bytes[bytes.length-1];
let raw=wmLeNumber(bytes.slice(0,-1));
let unit=wmUnit(code);

if(!unit){
wmRow(name,bytes.join(""),"Raw "+raw+", unit code 0x"+code.toUpperCase(),"info");
return;
}

if(unit.negative)raw=-raw;

wmRow(name,bytes.join(""),wmScaled(raw,unit.decimals)+" "+unit.unit+
" (raw unsigned "+Math.abs(raw)+", unit 0x"+code.toUpperCase()+
(unit.negative?", negative unit code":"")+")");

}

function wmBits(value){

return value.toString(2).padStart(8,"0");

}

function wmByteChecksum(bytes){

return bytes.reduce((sum,b)=>(sum+parseInt(b,16))&0xff,0);

}

function wmSigned8(hex){

let v=parseInt(hex,16);

return v>127?v-256:v;

}

function wmUnitScaleText(code){

let unit=wmUnit(code);

if(!unit)return "Unknown unit code 0x"+code.toUpperCase();

let scale=unit.decimals>0?"0."+("0".repeat(unit.decimals-1))+"1":"1";

return scale+" "+unit.unit+(unit.negative?" (negative unit code)":"");

}

function wmFormatByUnit(bytes,code){

let raw=wmLeNumber(bytes);
let unit=wmUnit(code);

if(!unit)
return "Raw unsigned "+raw+", unit code 0x"+code.toUpperCase();

if(unit.negative)raw=-raw;

return wmScaled(raw,unit.decimals)+" "+unit.unit+
" (raw unsigned "+Math.abs(raw)+", scale "+wmUnitScaleText(code)+")";

}

function wmBatteryVoltage(hex){

let raw=parseInt(hex,16);

return (raw/10).toFixed(1)+" V (raw unsigned "+raw+")";

}

function wmDateTime(bytes){

if(bytes.length<7)return "Data waktu tidak lengkap";

let second=parseInt(bytes[0],16);
let minute=parseInt(bytes[1],16);
let hour=parseInt(bytes[2],16);
let day=parseInt(bytes[3],16);
let month=parseInt(bytes[4],16);
let year=parseInt(bytes[5],16)+(parseInt(bytes[6],16)*256);
let pad=n=>n.toString().padStart(2,"0");
let valid=second<60&&minute<60&&hour<24&&day>=1&&day<=31&&month>=1&&month<=12;

return year+"-"+pad(month)+"-"+pad(day)+" "+pad(hour)+":"+pad(minute)+":"+pad(second)+
(valid?"":" (nilai tanggal di luar rentang)");

}

function wmStatus(bytes){

if(bytes.length<4){
wmRow("Status ST",bytes.join(""),"Status tidak lengkap","err");
return;
}

let s1=parseInt(bytes[0],16);
let s2=parseInt(bytes[1],16);
let s3=parseInt(bytes[2],16);
let s4=parseInt(bytes[3],16);
let first=["D0 Valve status: "+(s1&1?"closed":"open")];
let firstFlags=[
"D1 Battery voltage low","D2 Inductive sensor abnormal","D3 Backup battery voltage low",
"D4 Tamper / cover removed","D5 During valve opening","D6 During valve closing","D7 Metering module abnormal"
];

for(let i=1;i<8;i++)if(s1&(1<<i))first.push(firstFlags[i-1]);

let secondFlags=[
"D0 Valve abnormal","D1 GPRS battery low","D2 Reverse-flow alarm","D3 Sensor fault",
"D4 Valve leakage","D5 Water pressure abnormal","D6 Instantaneous flow abnormal","D7 System reset"
];
let second=[];

for(let i=0;i<8;i++)if(s2&(1<<i))second.push(secondFlags[i]);

let thirdFlags={
1:"D1 Unit price error",2:"D2 Previous magnetic interference",3:"D3 Pipeline leakage",
5:"D5 Current magnetic interference",6:"D6 Vendor flag",7:"D7 Vendor flag"
};
let third=[];

for(let i=0;i<8;i++)if((s3&(1<<i))&&thirdFlags[i])third.push(thirdFlags[i]);

wmRow("Status ST byte 1",bytes[0],"bits "+wmBits(s1)+"; "+first.join("; "),s1&0xfe?"err":"ok");
wmRow("Status ST byte 2",bytes[1],"bits "+wmBits(s2)+"; "+(second.length?second.join("; "):"Normal"),second.length?"err":"ok");
wmRow("Status ST byte 3",bytes[2],"bits "+wmBits(s3)+"; "+(third.length?third.join("; "):"Normal / reserved"),third.length?"err":"ok");
wmRow("Status ST byte 4",bytes[3],wmBatteryVoltage(bytes[3]),"info");

}

function wmDecode905F(data){

if(data.length<150){
wmRow("NB-IoT meter data","","Expected 150 data bytes for 0x905F, received "+data.length,"err");
return;
}

let forwardUnit=data[2];
let reverseUnit=data[3];
let instantUnit=data[4];

wmRow("Forward flow unit",forwardUnit,wmUnitScaleText(forwardUnit));
wmRow("Reverse flow unit",reverseUnit,wmUnitScaleText(reverseUnit));
wmRow("Instantaneous flow unit",instantUnit,wmUnitScaleText(instantUnit));
wmRow("Spare",data[5],"Reserved");

wmRow("Current forward flow",data.slice(6,10).join(""),wmFormatByUnit(data.slice(6,10),forwardUnit));

let remaining=wmLeNumber(data.slice(10,14),true);
wmRow("Current remaining amount",data.slice(10,14).join(""),wmScaled(remaining,2)+" (raw signed two's complement)");

wmStatus(data.slice(14,18));

wmRow("Recharge ID",data[18],parseInt(data[18],16).toString());
wmRow("Reverse flow",data.slice(19,23).join(""),wmFormatByUnit(data.slice(19,23),reverseUnit));
wmRow("Current instantaneous flow",data.slice(23,27).join(""),wmFormatByUnit(data.slice(23,27),instantUnit));
wmRow("Current water pressure",data[27],parseInt(data[27],16).toString()+" raw");

let hourlyStart=28;

for(let h=0;h<24;h++){

let idx=hourlyStart+(h*5);
let flow=data.slice(idx,idx+4);
let checksum=data[idx+4];
let calc=wmByteChecksum(flow).toString(16).padStart(2,"0");
let ok=checksum===calc;

wmRow("Hourly flow "+h.toString().padStart(2,"0")+":00",
data.slice(idx,idx+5).join(""),
wmFormatByUnit(flow,forwardUnit)+"; checksum 0x"+calc.toUpperCase()+" "+(ok?"OK":"ERROR"),
ok?"ok":"err");

}

wmRow("Signal intensity",data[148],"raw "+parseInt(data[148],16)+", signed "+wmSigned8(data[148]));
wmRow("Signal to noise ratio",data[149],"raw "+parseInt(data[149],16)+", signed "+wmSigned8(data[149]));

if(data.length>150)
wmRow("Extra data",data.slice(150).join(""),(data.length-150)+" extra bytes","info");

}

function wmDecodeData(data,control){

if(data.length<2){
wmRow("Data field",data.join(""),data.length+" bytes; data terlalu pendek untuk membaca ID","err");
return;
}

let id=(data[0]+data[1]).toLowerCase();

let ids={
"901e":"Read all meter data",
"905f":"NB-IoT GURTAM meter data",
"a017":"Valve control",
"a026":"GPRS heartbeat"
};

let layouts={
"901e":data.length===2?
"2 bytes; request baca semua data meter":
data.length+" bytes; DI(2) + forward flow unsigned(5) + reverse flow unsigned(5) + remaining amount signed(4) + instantaneous flow unsigned(4) + real-time(7) + status ST bit flags(4) + next purchase serial(1)",
"905f":data.length+" bytes; DI(2) + unit bytes(3) + spare(1) + current data(22) + 24 hourly flow records(120) + signal(1) + SNR(1)",
"a017":data.length+" bytes; DI(2) + valve command(1) + optional status ST(4)",
"a026":data.length+" bytes; DI(2) + heartbeat time / GPRS data"
};

wmRow("Data field",data.join(""),layouts[id]||data.length+" bytes; raw vendor data, format belum ada di dokumen",ids[id]?"":"info");

wmRow("Data identification",id,ids[id]||"Unknown / vendor-defined",ids[id]?"":"info");

if(id==="905f"){
wmDecode905F(data);
return;
}

if(id==="901e"){
if(data.length===2){
wmRow("Request","","Read all meter data");
return;
}

if(data.length<32){
wmRow("Meter data","","Expected 32 data bytes, received "+data.length,"err");
return;
}

wmMeasurement("Current forward flow",data.slice(2,7));
wmMeasurement("Reverse flow",data.slice(7,12));

let remaining=wmLeNumber(data.slice(12,16),true);
wmRow("Remaining amount",data.slice(12,16).join(""),wmScaled(remaining,2)+" (raw signed two's complement; currency follows device configuration)");

wmMeasurement("Instantaneous flow",data.slice(16,20));
wmRow("Real-time",data.slice(20,27).join(""),wmDateTime(data.slice(20,27)));
wmStatus(data.slice(27,31));
wmRow("Next purchase serial number",data[31],parseInt(data[31],16).toString());
return;
}

if(id==="a017"){
if(data.length<3){
wmRow("Valve command","","Valve type byte missing","err");
return;
}

let type=data[2].toLowerCase();
let valve=type==="55"?"Open valve":type==="99"?"Close valve":"Unknown command";

wmRow("Valve command",data[2],valve,type==="55"||type==="99"?"":"info");

if(data.length>=7)wmStatus(data.slice(3,7));
return;
}

if(id==="a026"){
if(data.length>=9){
wmRow("Heartbeat time",data.slice(2,9).join(""),wmDateTime(data.slice(2,9)));
}else if(data.length>=4){
wmRow("GPRS code",data.slice(2,4).join(""),data.slice(2,4).join(""));
}else{
wmRow("Heartbeat data","","Data heartbeat tidak lengkap","err");
}
return;
}

if(control&0x40)
wmRow("Communication status","","Slave reports abnormal data or frame format","err");

}

function decodeWM(){

let table=document.getElementById("wmResult");

table.style.opacity="0";
setTimeout(()=>{table.style.opacity="1";},50);

let raw=document.getElementById("wmHexInput").value
.replace(/0x/gi,"")
.replace(/[^0-9a-fA-F]/g,"")
.toLowerCase();

if(raw.length===0||raw.length%2!==0){
alert("Payload WM BLE bukan HEX yang valid");
return;
}

let bytes=raw.match(/.{2}/g);
let sof=bytes.indexOf("68");

wmClearTable();

if(sof<0){
wmRow("SOF","","Byte awal 0x68 tidak ditemukan","err");
return;
}

let preamble=bytes.slice(0,sof);
let core=bytes.slice(sof);

if(preamble.length){
let validPreamble=preamble.every(b=>b==="fe");
wmRow("Wake-up preamble",preamble.join(""),preamble.length+" byte FE",validPreamble?"ok":"err");
}

wmRow("SOF",core[0],core[0]==="68"?"Frame start":"Invalid SOF",core[0]==="68"?"ok":"err");

if(core.length<14){
wmRow("Frame","",core.length+" bytes; minimum 14 bytes","err");
return;
}

let meterTypes={
"10":"Cold water meter","11":"Hot water meter","12":"Direct drinking water meter",
"13":"Reclaimed water meter","15":"Identified water meter","20":"Heat meter (calorimeter)",
"21":"Heat meter (cooling capacity)","30":"Gas meter","40":"Other meter"
};
let meterType=core[1];

wmRow("Meter type",meterType,meterTypes[meterType]||"Unknown meter type","info");

let address=core.slice(2,8);
let addressHex=address.join("");
let broadcast=address.every(b=>b==="aa");
let serialBytes=address.slice(0,5).filter(b=>b!=="aa").reverse();
let serial=serialBytes.join("").toUpperCase();
let validBcd=serialBytes.every(b=>/^[0-9]{2}$/.test(b));

wmRow("Address A0-A5",addressHex,broadcast?"Broadcast address":
"S/N "+(validBcd&&serial?serial:"invalid BCD")+", vendor 0x"+address[5].toUpperCase(),broadcast?"info":"");

let addressSum=address.reduce((sum,b)=>(sum+parseInt(b,16))&0xff,0);
let addressCheck=parseInt(core[8],16);
let addressExpected=addressSum.toString(16).padStart(2,"0");
let addressOk=addressCheck===addressSum;
let broadcastConvention=broadcast&&core[8]==="aa";

wmRow("Address check A6",core[8],"Calc 0x"+addressExpected.toUpperCase()+
(addressOk?" = OK":broadcastConvention?"; 0xAA broadcast convention":" = ERROR"),
addressOk?"ok":broadcastConvention?"info":"err");

wmRow("Version",core[9],parseInt(core[9],16).toString());

let control=parseInt(core[10],16);
let functionCode=control&0x3f;
let functions={0:"Reserved",1:"Read data",3:"Read address",4:"Write data",21:"Write address",22:"Write meter reading"};
let direction=(control&0x80)?"Slave reply":"Master command";
let communication=(control&0x40)?"abnormal":"normal";

wmRow("Control code",core[10],direction+"; "+communication+"; "+
(functions[functionCode]||"Vendor function 0x"+functionCode.toString(16).padStart(2,"0").toUpperCase()),
communication==="normal"?"":"err");

let declared=parseInt(core[11],16);
let expectedLength=14+declared;

wmRow("Data length",core[11],declared+" bytes");
wmRow("Frame length","",core.length+" bytes"+
(core.length===expectedLength?" = OK":"; expected "+expectedLength),core.length===expectedLength?"ok":"err");

let dataEnd=Math.min(12+declared,core.length);
let data=core.slice(12,dataEnd);

wmDecodeData(data,control);

let checksumIndex=12+declared;

if(checksumIndex<core.length){
let checksum=core[checksumIndex];
let checksumCalc=core.slice(0,checksumIndex)
.reduce((sum,b)=>(sum+parseInt(b,16))&0xff,0)
.toString(16).padStart(2,"0");
let checksumOk=checksum===checksumCalc;

wmRow("Checksum CS",checksum,"Calc 0x"+checksumCalc.toUpperCase()+" = "+(checksumOk?"OK":"ERROR"),checksumOk?"ok":"err");
}else{
wmRow("Checksum CS","","Missing checksum","err");
}

let end=core[checksumIndex+1];

wmRow("End character",end||"",end==="16"?"Frame end":"Expected 0x16",end==="16"?"ok":"err");

if(core.length>expectedLength)
wmRow("Trailing bytes",core.slice(expectedLength).join(""),(core.length-expectedLength)+" extra bytes","info");

}

/* PARSER */

function parse(){

document.getElementById("result").style.opacity="0";

setTimeout(()=>{
document.getElementById("result").style.opacity="1";
},50);

let hexRaw=document
.getElementById("hexInput")
.value.replace(/0x/gi,'')
.replace(/[^0-9a-fA-F]/g,'')
.toLowerCase();

let bytes=hexRaw.match(/.{1,2}/g);

if(!bytes||hexRaw.length%2!==0){
alert("Invalid HEX");
return;
}

clearTable();

/* AUTO DETECT FRAME */

if(bytes[0]==="aa"&&bytes[1]==="55"){
decodeAA55(bytes);
return;
}

switch(bytes[0]){

case "25": decode25(bytes); return;
case "26": decode26(bytes); return;
case "32": decode32(bytes); return;
case "4a": decode4A(bytes); return;
case "15": decode15(bytes); return;
case "11": decodeICODE(bytes); return;
case "88": decode88(bytes); return;
case "36": decodeReset(bytes); return;
case "37": decodeReset(bytes); return;
case "51": decode51(bytes); return;
case "52": decode52(bytes); return;
case "70": decode70(bytes); return;
case "a1": decodeA1(bytes); return;
case "a3": decodeA3(bytes); return;
case "a5": decodeA5(bytes); return;

}

/* fallback : assume 0x11 status frame */

decodeICODE(bytes);

}

/* ============================================================
   0xAA55 FRAMES
   Length = bytes after CRC16
   CRC is calculated over the data segment following the CRC field
   ============================================================ */

function decodeAA55(b){

row("Frame Head",b[0]+b[1],"AA55 - Data frame start");

let hdr=b.slice(4,8).join("");

/* registration / heartbeat count the whole frame,
   command frames count the bytes after CRC16 */

let isCommand=(hdr==="01000300");

let declared=hexToInt(b[2]+b[3]);

let actual=isCommand?b.length-10:b.length;

row("Length",b[2]+b[3],
declared+(isCommand?" bytes setelah CRC16":" bytes")
+(declared===actual?"":"  (frame sebenarnya "+actual+" bytes)"),
declared===actual?"":"info");

if(isCommand){

row("Reserved port",hdr,"Fixed");

}else{

row("Version",b[4],hexToInt(b[4]));
row("Enctype",b[5],b[5]);
row("Type",b[6],b[6]);
row("Reserved",b[7],b[7]);

}

let crcFrame=(b[8]+b[9]).toLowerCase();

let crcCalc=calcCRC16(b.slice(10));

let status=(crcFrame===crcCalc)?"OK":"ERROR";

row("CRC16",
crcFrame,
"Calc 0x"+crcCalc+" = "+status,
status==="OK"?"ok":"err");

addressRow(b.slice(10,14));

if(b.length<15){
row("Function Code","","Missing","err");
return;
}

let fc=b[14];
let p=b.slice(15);

switch(fc){

case "d0": aa55D0(fc,p); return;
case "d2": aa55D2(fc,p); return;
case "d3": aa55D3(fc,p); return;
case "d4": aa55D4(fc,p); return;
case "13": aa55Heartbeat(fc,p); return;
case "15": aa55Uplink(fc,p); return;

}

row("Function Code",fc,"Unknown","err");

if(p.length)
row("Payload",p.join(""),p.length+" bytes");

}

/* walk the serial-no. tags to see whether an IMSI block is present */

function hasIMSI(p){

let i=0;

while(i<p.length){

if(p.length-i===1)return false;

let t=p[i];

if(t==="08")return true;

if(t==="07")i+=9;
else if(t==="03"||t==="05")i+=2;
else if(t==="09")i+=4;
else i++;

}

return false;

}

/* 5.1 / 5.2 Registration & Heartbeat packet (0xD0) */

function aa55D0(fc,p){

/* registration carries IMSI (serial no. 0x08), heartbeat does not.
   the tag must be walked, an IMEI/IMSI digit byte can also be 0x08 */


row("Function Code",fc,"0xD0 - Fixed");

let i=0;

while(i<p.length){

/* last remaining byte is the time zone */

if(p.length-i===1){

row("Time zone",p[i],"UTC+"+hexToInt(p[i]));
i++;
continue;

}

let tag=p[i];

if(tag==="07"&&p.length-i>=9){

row("Serial No.",tag,"0x07 - IMEI");
row("IMEI",p.slice(i+1,i+9).join(""),bcdDecode(p.slice(i+1,i+9)));
i+=9;

}else if(tag==="08"&&p.length-i>=9){

row("Serial No.",tag,"0x08 - IMSI");
row("IMSI",p.slice(i+1,i+9).join(""),bcdDecode(p.slice(i+1,i+9)));
i+=9;

}else if(tag==="03"&&p.length-i>=2){

row("Serial No.",tag,"0x03 - CSQ");
row("CSQ",p[i+1],hexToInt(p[i+1]));
i+=2;

}else if(tag==="05"&&p.length-i>=2){

row("Serial No.",tag,"0x05 - PCI");
row("PCI",p[i+1],hexToInt(p[i+1]));
i+=2;

}else if(tag==="09"&&p.length-i>=4){

row("Serial No.",tag,"0x09 - FW Version");

row("FW Version",
p.slice(i+1,i+4).join(""),
hexToInt(p[i+1])+"."+hexToInt(p[i+2])+"."+hexToInt(p[i+3]));

i+=4;

}else{

row("Unknown Serial No.",tag,"Unrecognized field","err");
i++;

}

}

}

/* ============================================================
   3.1 Response - full status frame (0x11)
   ============================================================ */

function decodeICODE(bytes){


row("Frame head",bytes[0],"Data frame start");

lengthRow(bytes[1],hexToInt(bytes[1]),bytes.length);

addressRow(bytes.slice(2,6));

row("Dimming port",bytes[6],"0x04 - Fixed");
row("Dimming function code",bytes[7],"0x10 - Fixed");

row("Dimming value",
bytes[8],
hexToInt(bytes[8])+" %");

row("Turn on/off port",bytes[9],"0x05 - Fixed");
row("Turn on/off function code",bytes[10],"0x04 - Fixed");

row("Turn on/off status",
bytes[11],
bytes[11]==="00"?"ON":"OFF");

row("Collection port",bytes[12],"0x00 - Fixed");
row("Collection function code",bytes[13],"0x20 - Fixed");
row("Effective length",bytes[14],"0x0C - Fixed");

row("Voltage",
bytes.slice(15,17).join(""),
hexToInt(bytes.slice(15,17).join(""))/100+" V");

row("Current",
bytes.slice(17,19).join(""),
hexToInt(bytes.slice(17,19).join(""))/1000+" A");

row("Active Power",
bytes.slice(19,21).join(""),
hexToInt(bytes.slice(19,21).join(""))/10+" W");

row("Reactive Power",
bytes.slice(21,23).join(""),
hexToInt(bytes.slice(21,23).join(""))/10+" VAR");

row("Frequency",
bytes.slice(23,25).join(""),
hexToInt(bytes.slice(23,25).join(""))/100+" Hz");

row("Active Energy",
bytes.slice(25,29).join(""),
hexToInt(bytes.slice(25,29).join(""))/100+" kWh");

let tempHex=bytes.slice(29,31).join("");

let temp=(hexToSigned16(tempHex)-10000)/100;

row("Temperature",tempHex,temp+" °C");

let timeHex=bytes.slice(31,34).join("");

row("Time",timeHex,formatTimeUTC7(timeHex)+" (UTC+7)");

let dateHex=bytes.slice(34,37).join("");

row("Date",dateHex,formatDateWithOverflow(dateHex));

let idx=37;

function get4(name,signed=false,unit=""){

let hex=bytes.slice(idx,idx+4).join("");

let val=signed?
hexToSigned32(hex):
hexToInt(hex);

row(name,hex,val+(unit?" "+unit:""));

idx+=4;

}

get4("Signal Power",true,"dBm");
get4("Total Power",true,"dBm");
get4("Tx Power",true,"dBm");
get4("Tx Time",false,"ms");
get4("Rx Time",false,"ms");
get4("Cell ID");
get4("ECL");
get4("SNR",true,"dB");
get4("Earfcn");
get4("PCI");
get4("RSRQ",true,"dB");

/* remaining : working times 4 + restart 2 [+ photo adc 1] + crc 2 */

let remaining=bytes.length-idx;

row("Device Working Times",
bytes.slice(idx,idx+4).join(""),
hexToInt(bytes.slice(idx,idx+4).join(""))+" min");

idx+=4;

row("Restart Times",
bytes.slice(idx,idx+2).join(""),
hexToInt(bytes.slice(idx,idx+2).join("")));

idx+=2;

if(remaining>=9){

row("Photo ADC",
bytes[idx],
hexToInt(bytes[idx])*10+" mV (ADC "+hexToInt(bytes[idx])+")");

idx++;

}

crcTail(bytes);

}

/* ============================================================
   KONVERTER BILANGAN
   ============================================================ */

const BASE_NAME={bin:"biner",dec:"desimal",oct:"oktal",hex:"hexadecimal",text:"teks"};

const BASE_CLEAN={bin:/[^01]/g,oct:/[^0-7]/g,dec:/[^0-9]/g,hex:/[^0-9a-fA-F]/g};

/* semua base diubah dulu ke string hex, lengkap dengan lebar byte-nya */

function convToHex(base,raw){

if(base==="text"){

let out="";

for(let i=0;i<raw.length;i++)
out+=(raw.charCodeAt(i)&0xFF).toString(16).padStart(2,'0');

return out;

}

let s=raw.replace(/0x/gi,'').replace(BASE_CLEAN[base],'');

if(!s)return "";

if(base==="hex")
return (s.length%2?"0"+s:s).toLowerCase();

let v=base==="bin"?BigInt("0b"+s):
base==="oct"?BigInt("0o"+s):
BigInt(s);

let hex=v.toString(16);

if(base==="bin"){

let bytes=Math.ceil(s.length/8);

return hex.padStart(bytes*2,'0');

}

return hex.length%2?"0"+hex:hex;

}

function convGroup(s,n,sep=" "){

let re=new RegExp("(.{"+n+"})(?=.)","g");

return s.replace(re,"$1"+sep);

}

function convAscii(hex){

let bytes=hex.match(/.{2}/g)||[];

let out="";

for(let b of bytes){

let c=parseInt(b,16);

if(c<32||c>126)return null;

out+=String.fromCharCode(c);

}

return out;

}

/* hex -> base tujuan */

function convFormat(base,hex,group){

if(!hex)return "";

let v=BigInt("0x"+hex);

let bytes=hex.length/2;

if(base==="hex"){
let s=hex.toUpperCase();
return group?convGroup(s,2):s;
}

if(base==="dec")
return v.toString(10);

if(base==="oct")
return v.toString(8);

if(base==="bin"){
let s=v.toString(2).padStart(bytes*8,'0');
return group?convGroup(s,8):s;
}

if(base==="text"){
let t=convAscii(hex);
return t===null?"(ada byte yang tidak bisa dicetak)":t;
}

return "";

}

/* desimal dikelompokkan dari belakang : 1,234,567 */

function convGroupDec(s){

return s.replace(/\B(?=(\d{3})+(?!\d))/g,",");

}

function convCard(label,value,wide){

return '<div class="card'+(wide?' wide':'')+'"><span>'+label+'</span><b>'+value+'</b></div>';

}

function convCopy(){

let t=document.getElementById("cOut").innerText;

if(!t)return;

navigator.clipboard.writeText(t).then(()=>{

let b=document.getElementById("cCopy");

b.innerText="Tersalin";

setTimeout(()=>{b.innerText="Salin hasil";},1200);

},()=>{});

}

function convSwap(){

let f=document.getElementById("cFrom");
let t=document.getElementById("cTo");

let hex=convToHex(f.value,document.getElementById("cIn").value);

let a=f.value;

f.value=t.value;
t.value=a;

/* hasil sebelumnya jadi input, supaya benar-benar tertukar */

document.getElementById("cIn").value=convFormat(f.value,hex,false);

convRun();

}

function convReset(){

document.getElementById("cIn").value="";

convRun();

}

function convRun(){

let from=document.getElementById("cFrom").value;
let to=document.getElementById("cTo").value;
let group=document.getElementById("cGroup").checked;

document.getElementById("cInLabel").innerText="Bilangan "+BASE_NAME[from];
document.getElementById("cOutLabel").innerText="Hasil dalam "+BASE_NAME[to];

let hex=convToHex(from,document.getElementById("cIn").value);

let out=document.getElementById("cOut");
let cards=document.getElementById("cCards");
let extra=document.getElementById("cExtra");

if(!hex){

out.innerText="";
cards.innerHTML="";
extra.innerHTML="";
document.getElementById("cMore").style.display="none";
return;

}

document.getElementById("cMore").style.display="block";

let v=BigInt("0x"+hex);
let bytes=hex.length/2;

/* hasil utama */

let main=convFormat(to,hex,group);

if(to==="dec"&&group)main=convGroupDec(v.toString(10));

if(out.innerText!==main){

out.innerText=main;
flashEl(out);

}

/* kartu : hanya basis lain, yang sedang ditampilkan besar tidak diulang */

let all=[];

if(to!=="hex")
all.push(convCard("Hexadecimal","0x"+(group?convGroup(hex.toUpperCase(),2):hex.toUpperCase())));

if(to!=="dec")
all.push(convCard("Decimal",group?convGroupDec(v.toString(10)):v.toString(10)));

if(to!=="oct")
all.push(convCard("Octal",v.toString(8)));

if(to!=="bin")
all.push(convCard("Binary",convGroup(v.toString(2).padStart(bytes*8,'0'),8)));

let txt=convAscii(hex);

if(txt!==null&&bytes>1&&to!=="text")
all.push(convCard("Text (ASCII)",txt));

all.push(convCard("Panjang",bytes+" byte"));

cards.innerHTML=all.join("");

/* detail : hanya yang benar-benar memberi informasi tambahan */

let more=[];

let bits=BigInt(bytes*8);
let signed=v;

if((v>>(bits-1n))&1n)signed=v-(1n<<bits);

if(signed!==v)
more.push(convCard("Signed 2's complement",signed.toString(10)));

let n=Number(v);

if(Number.isSafeInteger(n)){

more.push(convCard("&divide; 10 &nbsp; W, VAR",n/10));
more.push(convCard("&divide; 100 &nbsp; V, Hz, kWh, VA",n/100));
more.push(convCard("&divide; 1000 &nbsp; A",n/1000));
more.push(convCard("Suhu (nilai - 10000) / 100",((n-10000)/100)+" \u00B0C"));

}

if(to==="dec"&&from!=="text"&&from!=="dec"){

let radix=from==="hex"?16:from==="oct"?8:2;

let digits=from==="hex"?hex.toUpperCase().replace(/^0+(?=.)/,''):v.toString(radix);

if(digits.length<=10){

let parts=[];
let power=digits.length-1;

for(let d of digits){
parts.push(d+" \u00D7 "+radix+"^"+power);
power--;
}

more.push(convCard("Langkah hitung",parts.join("  +  ")+"  =  "+v.toString(10),true));

}

}

extra.innerHTML=more.join("");

}

/* ============================================================
   WAKTU & EPOCH
   ============================================================ */

const WIB={timeZone:"Asia/Jakarta",hour12:false};
const UTCZ={timeZone:"UTC",hour12:false};

function timeFormat(d,opt){

return d.toLocaleString("id-ID",Object.assign({
year:"numeric",month:"2-digit",day:"2-digit",
hour:"2-digit",minute:"2-digit",second:"2-digit"},opt));

}

function timeRelative(ms){

let d=Date.now()-ms;

let past=d>=0;

d=Math.abs(d);

let s=Math.round(d/1000);
let txt;

if(s<60)txt=s+" detik";
else if(s<3600)txt=Math.round(s/60)+" menit";
else if(s<86400)txt=Math.round(s/3600)+" jam";
else txt=Math.round(s/86400)+" hari";

return past?txt+" lalu":"dalam "+txt;

}

/* waktu dalam frame ICODE : Time = SS MM HH, Date = DD MM YY, UTC+0 */

function timeIcodeHex(d){

let p=n=>n.toString(16).padStart(2,'0').toUpperCase();

let t=p(d.getUTCSeconds())+" "+p(d.getUTCMinutes())+" "+p(d.getUTCHours());
let g=p(d.getUTCDate())+" "+p(d.getUTCMonth()+1)+" "+p(d.getUTCFullYear()%100);

return [t,g];

}

function timeCards(ms){

let d=new Date(ms);

if(isNaN(d.getTime()))return '<div class="card wide"><span>Tidak valid</span><b>Nilai di luar jangkauan tanggal</b></div>';

let icode=timeIcodeHex(d);

return [
convCard("Waktu lokal (WIB)",timeFormat(d,WIB)),
convCard("UTC",timeFormat(d,UTCZ)),
convCard("ISO 8601",d.toISOString()),
convCard("Detik (epoch)",Math.floor(ms/1000)),
convCard("Milidetik",ms),
convCard("Selisih dari sekarang",timeRelative(ms)),
convCard("Frame ICODE &mdash; Time (SS MM HH)","0x"+icode[0]),
convCard("Frame ICODE &mdash; Date (DD MM YY)","0x"+icode[1])
].join("");

}

let ms=Date.now();

let el=document.getElementById("tNow");

if(!el)return;

el.innerText=ms;

document.getElementById("tNowCards").innerHTML=[
convCard("Detik (epoch)",Math.floor(ms/1000)),
convCard("Waktu lokal (WIB)",timeFormat(new Date(ms),WIB)),
convCard("UTC",timeFormat(new Date(ms),UTCZ)),
convCard("ISO 8601",new Date(ms).toISOString())
].join("");

}

}

/* pointer-driven 3D parallax */
document.addEventListener("pointermove",e=>{
let x=(e.clientX/window.innerWidth-.5)*2;
let y=(e.clientY/window.innerHeight-.5)*2;
document.documentElement.style.setProperty("--mx",x.toFixed(3));
document.documentElement.style.setProperty("--my",y.toFixed(3));
document.documentElement.style.setProperty("--rx",(y*8).toFixed(2)+"deg");
document.documentElement.style.setProperty("--ry",(-x*8).toFixed(2)+"deg");
});

document.querySelectorAll("button,.card,#tab-decode,#tab-wmble,#tab-conv,#tab-time").forEach(el=>{
el.addEventListener("pointerenter",()=>{
let root=getComputedStyle(document.documentElement);
let x=parseFloat(root.getPropertyValue("--mx"))||0;
let y=parseFloat(root.getPropertyValue("--my"))||0;
el.style.transform=`translateY(-3px) rotateX(${(-y*1.8).toFixed(2)}deg) rotateY(${(x*1.8).toFixed(2)}deg) translateZ(8px)`;
});
el.addEventListener("pointerleave",()=>el.style.transform="");
});

/* UX FEATURES */

convRun();
timeInit();

const hexBox=document.getElementById("hexInput");

hexBox.addEventListener("focus",()=>{
if(hexBox.value.length>0)
hexBox.select();
});

hexBox.addEventListener("paste",e=>{
e.preventDefault();
let text=(e.clipboardData||window.clipboardData).getData("text");
hexBox.value=text.replace(/\s/g,'');
parse();
});

hexBox.addEventListener("dragover",e=>{
e.preventDefault();
hexBox.classList.add("drag");
});

hexBox.addEventListener("dragleave",()=>{
hexBox.classList.remove("drag");
});

hexBox.addEventListener("drop",e=>{
e.preventDefault();
hexBox.classList.remove("drag");

let text=e.dataTransfer.getData("text");

if(text){
hexBox.value=text.replace(/\s/g,'');
parse();
}

});

const wmHexBox=document.getElementById("wmHexInput");

wmHexBox.addEventListener("focus",()=>{
if(wmHexBox.value.length>0)
wmHexBox.select();
});

wmHexBox.addEventListener("paste",e=>{
e.preventDefault();
let text=(e.clipboardData||window.clipboardData).getData("text");
wmHexBox.value=text;
decodeWM();
});

wmHexBox.addEventListener("dragover",e=>{
e.preventDefault();
wmHexBox.classList.add("drag");
});

wmHexBox.addEventListener("dragleave",()=>{
wmHexBox.classList.remove("drag");
});

wmHexBox.addEventListener("drop",e=>{
e.preventDefault();
wmHexBox.classList.remove("drag");

let text=e.dataTransfer.getData("text");

if(text){
wmHexBox.value=text;
decodeWM();
}

});

</script>
